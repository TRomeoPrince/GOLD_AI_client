name: AZT Client connection regression
on:
  push:
    branches: [fix/azt-connection-regression-20261029]
    paths: ["tests/**", "client/**", ".github/workflows/connection-regression.yml"]
  workflow_dispatch:
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Test client HTTP recovery
        run: python -m unittest discover -s tests -p "test_network_regression.py" -v
