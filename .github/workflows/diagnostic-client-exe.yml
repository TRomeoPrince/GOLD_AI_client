name: Diagnostic Client EXE
on:
  push:
    branches: [fix/azt-connection-regression-20261029]
    paths: [".github/workflows/diagnostic-client-exe.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Client regression tests
        shell: cmd
        run: python -m unittest discover -s tests -p "test_network_regression.py" -v
      - name: Build Client diagnostic executable
        shell: cmd
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build\pyi build\GOLD_AI_Client.spec
      - uses: actions/upload-artifact@v4
        with:
          name: AZT-Client-Diagnostic
          path: dist/AZT_Client.exe
          if-no-files-found: error
          retention-days: 14
